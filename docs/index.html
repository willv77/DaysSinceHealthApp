<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'">
<title>Wellness</title>
<meta name="theme-color" content="#0f141b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Balance and Wellness">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1 id="title">Wellness</h1>
  <div class="hdr"><button id="undo" class="undo" type="button" aria-label="Undo today's logs" aria-haspopup="dialog" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button><button id="bell" class="bell" type="button"></button><button id="date" class="date" type="button"></button></div>
</header>
<main id="app"></main>
<nav>
  <button type="button" data-tab="today" class="on"><span aria-hidden="true">&#127968;</span>Today</button>
  <button type="button" data-tab="history"><span aria-hidden="true">&#128197;</span>History</button>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastMsg"></span></div>
<div class="sheet" id="sheet" hidden>
  <div class="pop" role="dialog" aria-modal="true" aria-labelledby="popTitle">
    <div class="poph"><h2 id="popTitle">Logged today</h2><button id="popClose" type="button">Done</button></div>
    <ol id="popList"></ol>
  </div>
</div>
<div class="notif" id="notif" role="status" aria-live="polite">
  <img src="icons/icon-180.png" alt="">
  <div><div class="nh"><b>BALANCE AND WELLNESS</b><span id="notifLabel"></span></div><div id="notifTitle" class="nt"></div><div id="notifBody" class="nb"></div></div>
</div>
<script src="core.js"></script>
<script src="figures.js"></script>
<script src="app.js"></script>
</body>
</html>
