<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Figure style options</title>
<style>
  body { margin: 0; padding: 16px; background: #0f141b; color: #e5e7eb; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { color: #94a3b8; margin: 0 0 14px; font-size: 14px; }
  table { border-collapse: separate; border-spacing: 8px; }
  th { font-size: 13px; color: #94a3b8; font-weight: 600; text-align: center; }
  th.row { text-align: right; color: #e5e7eb; padding-right: 6px; }
  td { background: #182030; border-radius: 14px; width: 110px; height: 110px; padding: 6px; }
  td.tile { background: transparent; padding: 0; }
  .fig { width: 100%; height: 100%; display: block; }
  .st { border-radius: 14px; padding: 8px 4px 6px; text-align: center; border: 2px solid; width: 104px; }
  .st .fig { height: 54px; }
  .st div { font-size: 12px; font-weight: 600; }
</style>
</head>
<body>
<h1>Figure style options</h1>
<p>Same new poses in 3 styles (1-3), plus the current figures for comparison. Last column = style 1 at real tile size.</p>
<table id="t"></table>
<script src="common.js"></script>
<script src="poses.js"></script>
<script>
const ROWS = [['yoga', 'Yoga'], ...STRENGTH.map(f => [f.id, f.name])];
const current = (id, c) => (id === 'yoga' ? yogaSVG(c) : facetSVG(id, c));
document.getElementById('t').innerHTML =
  `<tr><th></th><th>Current</th>${Object.values(STYLES).map(s => `<th>${s.name}</th>`).join('')}<th>Tile preview</th></tr>` +
  ROWS.map(([id, name]) => {
    const c = col(state[id].s);
    return `<tr><th class="row">${name}</th><td>${current(id, c)}</td>
      ${Object.keys(STYLES).map(k => `<td>${poseSVG(id, k, c)}</td>`).join('')}
      <td class="tile"><div class="st" style="border-color:${c};background:${mix(c, BG, .12)}">${poseSVG(id, 1, c, mix(c, BG, .12))}<div>${name}</div></div></td></tr>`;
  }).join('');
</script>
</body>
</html>
