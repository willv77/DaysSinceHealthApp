<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mockup B - Tabs</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: #f1f5f9; color: #0f172a; display: flex; flex-direction: column; }
  header { padding: 16px 18px 4px; }
  header .t { font-size: 28px; font-weight: 800; }
  header .d { color: #64748b; font-size: 14px; }
  main { flex: 1; overflow: auto; padding: 6px 12px 12px; }
  .pane { display: none; } .pane.on { display: block; }
  .card { background: #fff; border-radius: 20px; padding: 12px; box-shadow: 0 1px 3px #0001; }
  .body { width: 100%; display: block; cursor: pointer; }
  .hint { text-align: center; color: #64748b; font-size: 13px; margin: 8px 0 0; }
  .big { text-align: center; cursor: pointer; padding: 24px 12px; }
  .big .fig { width: 80%; max-width: 260px; }
  .rows { padding: 4px 0; }
  .row { display: grid; grid-template-columns: 56px 1fr auto; align-items: center; gap: 12px; padding: 8px 12px 8px 10px; border-left: 6px solid; border-bottom: 1px solid #f1f5f9; cursor: pointer; }
  .row:last-child { border-bottom: 0; }
  .row .fig { width: 56px; height: 56px; }
  .row .nm { font-size: 17px; font-weight: 600; }
  .row i { width: 22px; height: 22px; border-radius: 50%; display: block; }
  .chart { width: 100%; display: block; }
  h3 { margin: 4px 4px 8px; font-size: 16px; }
  nav { display: grid; grid-template-columns: repeat(4, 1fr); background: #fff; border-top: 1px solid #e2e8f0; padding: 6px 0 calc(6px + env(safe-area-inset-bottom)); }
  nav button { background: none; border: 0; font-size: 11px; color: #64748b; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  nav button span { font-size: 20px; }
  nav button.on { color: #2563eb; font-weight: 700; }
  .toast { position: fixed; left: 12px; right: 12px; bottom: 74px; background: #0f172a; color: #fff; border-radius: 14px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; transform: translateY(160px); transition: transform .25s; font-size: 15px; }
  .toast.show { transform: none; }
  .toast button { background: #facc15; color: #0f172a; border: 0; border-radius: 10px; padding: 8px 14px; font-weight: 700; font-size: 15px; }
</style>
</head>
<body>
<header><div class="t" id="title">Mobility</div><div class="d">Tap a joint to log</div></header>
<main id="app"></main>
<nav>
  <button data-tab="mob" class="on"><span>&#129493;</span>Mobility</button>
  <button data-tab="yoga"><span>&#129496;</span>Yoga</button>
  <button data-tab="strength"><span>&#127947;</span>Strength</button>
  <button data-tab="trends"><span>&#128200;</span>Trends</button>
</nav>
<script src="common.js"></script>
<script>
let tab = 'mob';
const TITLES = { mob: ['Mobility', 'Tap a joint to log'], yoga: ['Isometric Yoga', 'Tap the figure to log'], strength: ['Strength', 'Tap an exercise to log'], trends: ['Trends', 'Last 30 days'] };
function big(id) {
  const st = state[id];
  return `<div class="card big" data-bump="${id}" style="background:${col(st.s)}1f;border:3px solid ${col(st.s)}">
    ${yogaSVG(col(st.s))}</div>`;
}
function rows() {
  return `<div class="card rows">${STRENGTH.map(f => { const st = state[f.id]; return `<div class="row" data-bump="${f.id}" style="border-left-color:${col(st.s)}">
    ${facetSVG(f.id, col(st.s))}<div class="nm">${f.name}</div><i style="background:${col(st.s)}"></i></div>`; }).join('')}</div>`;
}
function render() {
  document.getElementById('title').textContent = TITLES[tab][0];
  document.querySelector('header .d').textContent = TITLES[tab][1];
  document.getElementById('app').innerHTML = `
    <div class="pane ${tab === 'mob' ? 'on' : ''}"><div class="card">${bodySVG({ callouts: true, sil: '#cbd5e1' })}</div></div>
    <div class="pane ${tab === 'yoga' ? 'on' : ''}">${big('yoga')}</div>
    <div class="pane ${tab === 'strength' ? 'on' : ''}">${rows()}</div>
    <div class="pane ${tab === 'trends' ? 'on' : ''}">
      <div class="card"><h3>Days since, over time</h3>${daysChart()}</div><br>
      <div class="card"><h3>Days since (now)</h3>${daysList({ line: '#f1f5f9' })}</div>
    </div>`;
}
document.querySelector('nav').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]'); if (!b) return;
  tab = b.dataset.tab;
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
  render();
});
if (TITLES[location.hash.slice(1)]) document.querySelector(`nav [data-tab="${location.hash.slice(1)}"]`).click();
render();
</script>
</body>
</html>
