<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5:00 AM notification styles</title>
<style>
  body { margin: 0; padding: 20px; background: #d4d8de; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  h1 { font-size: 18px; margin: 0 0 4px; text-align: center; }
  p.sub { margin: 0 0 16px; text-align: center; color: #475569; font-size: 13px; }
  .wrap { display: flex; gap: 22px; flex-wrap: wrap; justify-content: center; }
  figure { margin: 0; text-align: center; }
  figcaption { font-weight: 700; margin-bottom: 8px; }
  figcaption small { display: block; font-weight: 400; color: #475569; }
  .phone { width: 330px; height: 700px; border: 9px solid #111; border-radius: 42px; overflow: hidden; color: #fff;
    background: radial-gradient(120% 80% at 30% 10%, #334155 0%, #0f172a 55%, #020617 100%); padding: 0 10px; box-sizing: border-box; }
  .clock { text-align: center; margin: 26px 0 18px; }
  .clock .d { font-size: 15px; opacity: .8; }
  .clock .t { font-size: 72px; font-weight: 300; line-height: 1; letter-spacing: -2px; }
  .tag { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; opacity: .6; margin: 10px 4px 3px; text-align: left; }
  .n { display: grid; grid-template-columns: 34px 1fr; gap: 9px; background: #ffffff2b; backdrop-filter: blur(18px); border-radius: 18px; padding: 10px 11px; text-align: left; }
  .n img { width: 34px; height: 34px; border-radius: 8px; }
  .n .h { display: flex; justify-content: space-between; font-size: 13px; }
  .n .h b { font-weight: 600; }
  .n .h span { opacity: .6; font-size: 12px; }
  .n .b { font-size: 13px; line-height: 1.3; opacity: .92; white-space: pre-line; }
</style>
</head>
<body>
<h1>5:00 AM notification styles</h1>
<p class="sub">Each phone shows one style for four example mornings: reds + oranges, oranges only, yellows only, all green.</p>
<div class="wrap" id="wrap"></div>
<script>
const S = {
  reds: ['Hips', 'Knees', 'Pull', 'Active Imagination'], oranges: ['Wrists', 'Meditation'], yellows: ['Neck', 'Isometric Yoga'],
};
const list = a => a.length < 3 ? a.join(' and ') : `${a.slice(0, -1).join(', ')} and ${a.at(-1)}`;
const DAYS = [
  ['Reds + oranges', { r: S.reds, o: S.oranges }],
  ['Oranges only', { r: [], o: S.oranges }],
  ['Yellows only', { r: [], o: [], y: S.yellows }],
  ['All green', { r: [], o: [], y: [] }],
];
const STYLES = [
  ['A - Traffic light', 'colour counts in title, names in body', d =>
    d.r.length ? [`🔴 ${d.r.length} red · 🟠 ${d.o.length} orange`, `Red: ${d.r.join(', ')}\nOrange: ${d.o.join(', ')}`]
    : d.o.length ? [`🟠 ${d.o.length} orange`, d.o.join(', ')]
    : d.y?.length ? [`🟡 ${d.y.length} turning yellow`, `No reds or oranges. ${d.y.join(', ')}`]
    : ['🟢 All green', 'Nothing due today.']],
  ['B - Worst first', 'one headline item, rest in body', d =>
    d.r.length ? [`🔴 ${d.r[0]} is overdue`, `Also red: ${d.r.slice(1).join(', ')}\nOrange: ${d.o.join(', ')}`]
    : d.o.length ? [`🟠 ${d.o[0]} is slipping`, `Also orange: ${d.o.slice(1).join(', ')}`]
    : d.y?.length ? [`🟡 ${d.y[0]} is turning yellow`, `Also yellow: ${d.y.slice(1).join(', ')}`]
    : ['🟢 All green', 'Nothing due today.']],
  ['C - By section', 'grouped like the app', d =>
    d.r.length ? ['🔴 Overdue today', 'Mobility 🔴 Hips, Knees 🟠 Wrists\nStrength 🔴 Pull\nYoga & Mind 🔴 Active Imagination 🟠 Meditation']
    : d.o.length ? ['🟠 Slipping today', 'Mobility 🟠 Wrists\nYoga & Mind 🟠 Meditation']
    : d.y?.length ? ['🟡 Coming up', 'Mobility 🟡 Neck\nYoga & Mind 🟡 Isometric Yoga']
    : ['🟢 All green', 'Every section is up to date.']],
  ['D - Coach', 'friendly sentence, plan for the day', d =>
    d.r.length ? [`Good morning - ${d.r.length} reds today 🔴`, `Start with ${list(d.r)}, then ${list(d.o)}.`]
    : d.o.length ? [`Good morning - ${d.o.length} slipping 🟠`, `Fit in ${list(d.o)} today.`]
    : d.y?.length ? ['Good morning - on track 🟡', `Optional: ${list(d.y)} are turning yellow.`]
    : ['Good morning - all green 🟢', 'Enjoy the rest day.']],
];
document.getElementById('wrap').innerHTML = STYLES.map(([name, desc, fn]) => `<figure>
  <figcaption>${name}<small>${desc}</small></figcaption>
  <div class="phone"><div class="clock"><div class="d">Monday, November 23</div><div class="t">5:00</div></div>
  ${DAYS.map(([tag, d]) => { const [t, b] = fn(d); return `<div class="tag">${tag}</div>
    <div class="n"><img src="../docs/icons/icon-180.png" alt=""><div><div class="h"><b>${t}</b><span>now</span></div><div class="b">${b}</div></div></div>`; }).join('')}
  </div></figure>`).join('');
</script>
</body>
</html>
